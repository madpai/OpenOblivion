plugins { id 'com.android.application' }
def nativeStairs = providers.gradleProperty('ooNativeGroundedEye').orElse('false').get() == 'true'
def installedAssets = providers.gradleProperty('ooInstalledAssets').orElse('false').get() == 'true'
def downloadAssets = providers.gradleProperty('ooDownloadAssets').orElse('false').get() == 'true'
android {
    // The unchanged donor SDL Java bridge imports this resource namespace.
    namespace 'com.libopenmw.openmw'
    compileSdk 35
    defaultConfig {
        applicationId 'org.openoblivion.preview'
        minSdk 29
        targetSdk 32
        versionCode downloadAssets ? 34 : (installedAssets ? 23 : (nativeStairs ? 22 : 3))
        versionName downloadAssets ? '0.34-faces' : installedAssets ? '0.23-installed-body' : (nativeStairs ? '0.22-body' : '0.3-camera-repair')
        buildConfigField 'boolean', 'NATIVE_GROUNDED_EYE', nativeStairs.toString()
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig = true }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] } }
    androidResources { noCompress += ['zip'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
