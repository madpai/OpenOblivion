plugins { id 'com.android.application' }
def nativeStairs = providers.gradleProperty('ooNativeGroundedEye').orElse('false').get() == 'true'
android {
    // The unchanged donor SDL Java bridge imports this resource namespace.
    namespace 'com.libopenmw.openmw'
    compileSdk 35
    defaultConfig {
        applicationId 'org.openoblivion.preview'
        minSdk 29
        targetSdk 32
        versionCode nativeStairs ? 7 : 3
        versionName nativeStairs ? '0.7-controls' : '0.3-camera-repair'
        buildConfigField 'boolean', 'NATIVE_GROUNDED_EYE', nativeStairs.toString()
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig = true }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] } }
    androidResources { noCompress += ['zip'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
