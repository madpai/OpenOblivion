name: foundation
on: [push, pull_request]
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-30
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public history and publication boundary
        run: python3 tools/content_guard.py --history
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ python3 git zlib1g-dev libvulkan-dev luajit
      - name: Fetch immutable dependency
        run: python3 tools/fetch_upstream.py --cache "$RUNNER_TEMP/openoblivion-deps"
      - name: Configure and build
        run: |
          cmake -S . -B "$RUNNER_TEMP/oo-build" -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOO_OPENMW_SOURCE="$RUNNER_TEMP/openoblivion-deps/openmw"
          cmake --build "$RUNNER_TEMP/oo-build" --parallel 4
      - name: Original fixture and guard tests
        run: ctest --test-dir "$RUNNER_TEMP/oo-build" --output-on-failure

  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-30
        with:
          persist-credentials: false
      - name: Pinned NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.0.13004108'
      - name: Fetch immutable dependency
        run: python3 tools/fetch_upstream.py --cache "$RUNNER_TEMP/openoblivion-deps"
      - name: Cross-compile probes
        run: |
          cmake -S . -B "$RUNNER_TEMP/oo-arm64" -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.0.13004108/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DOO_OPENMW_SOURCE="$RUNNER_TEMP/openoblivion-deps/openmw"
          cmake --build "$RUNNER_TEMP/oo-arm64" --parallel 4
          file "$RUNNER_TEMP/oo-arm64/openoblivion-inspect" "$RUNNER_TEMP/oo-arm64/openoblivion-vulkan-probe"
